# CF-04 token allocations — operator-measured inputs.
# Every value below is OPEN until the operator records a real zIDE
# observation (quota currency, remaining balance, observation lag, outside
# usage). The ledger refuses dispatch while an allocation stays OPEN or is
# missing. Replace placeholders with measured integers + derivation notes;
# never invent numbers.

[pilot]
remaining_quota_tokens = 100_000_000     # operator-provided (Abdullah, 2026-09-06): measured remaining zIDE balance
safety_margin_tokens = 10_000_000        # 10% reserve for maintenance/emergency + measurement error
pilot_cap_tokens = 90_000_000            # min(remaining - margin, estimated need); estimated need still OPEN until CF-07 measures actuals

[preparation]
allowance_tokens = 2_000_000             # bounded allowance for model-assisted agent sessions (proposed; adjustable)
prior_usage_tokens = 0                   # attributable prior usage on this pilot (agent-estimated; operator may correct)

[runs]
# One entry per bounded run; allocate by expected work, not equal division.
cf06_calibration = 3_000_000             # before any live CF-06 judge dispatch (proposed)
cf07_trial = 5_000_000                   # first full lesson incl. retries + judging (proposed)
cf08_production = 80_000_000             # remainder of pilot cap for course production (proposed)

[maintenance]
headroom_tokens = 10_000_000             # = the safety margin above, reserved before CF-13 operation

[reconciliation]
observation_cadence = "weekly, or immediately after any heavy session"  # operator may tighten
quota_period_reset = "OPEN"              # still needed: the measured period boundary
